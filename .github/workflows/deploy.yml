name: 🚦 Deploy to Staging (GitHub Pages)
# -------------------------------------------------------
# STAGING ENVIRONMENT
# Triggers automatically on every push to: main
#
# Environment flow:
#   Dev    → localhost:5173       (your machine)
#   Staging→ GitHub Pages         (this workflow, auto)
#   Prod   → Firebase Hosting     (deploy-production.yml, manual only)
# -------------------------------------------------------

on:
  push:
    branches: ["main"]   # staging auto-deploys on every push to main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build
        env:
          VITE_BASE_PATH: /asset-tracker/

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
