<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="40" height="40">
  <defs>
    <linearGradient id="silverJewelry" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#E2E8F0"/>
      <stop offset="80%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <filter id="silverJewelryGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#94A3B8" flood-opacity="0.3"/>
    </filter>
  </defs>
  <g filter="url(#silverJewelryGlow)">
    <!-- Ornate Jewelry Ring / Pendant -->
    <circle cx="24" cy="27" r="13" fill="none" stroke="url(#silverJewelry)" stroke-width="4.5"/>
    <!-- Gem mount / Crown -->
    <polygon points="24,6 31,16 17,16" fill="url(#silverJewelry)"/>
    <!-- Sparkling Gemstone / Sapphire -->
    <polygon points="24,9 29,15 19,15" fill="#60A5FA"/>
    <polygon points="24,9 26.5,15 21.5,15" fill="#93C5FD"/>
    <!-- Small studs -->
    <circle cx="16" cy="22" r="1.5" fill="#FFFFFF"/>
    <circle cx="32" cy="22" r="1.5" fill="#FFFFFF"/>
    <circle cx="24" cy="38" r="1.5" fill="#FFFFFF"/>
  </g>
</svg>
