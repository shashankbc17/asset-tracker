<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="40" height="40">
  <defs>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#E2E8F0"/>
      <stop offset="70%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <linearGradient id="silverTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="silverSide" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="silverGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#94A3B8" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Outer Glow / Shadow -->
  <g filter="url(#silverGlow)">
    <!-- Base Bar -->
    <polygon points="6,34 42,34 38,40 10,40" fill="url(#silverSide)" />
    <!-- Front Face -->
    <polygon points="8,18 40,18 42,34 6,34" fill="url(#silverGrad)" />
    <!-- Top Face -->
    <polygon points="14,10 34,10 40,18 8,18" fill="url(#silverTop)" />
    <!-- Side Left Bevel -->
    <polygon points="14,10 8,18 6,34 10,40 12,34" fill="#CBD5E1" opacity="0.6"/>
  </g>
  
  <!-- Stamp / Engraving -->
  <rect x="18" y="22" width="12" height="6" rx="1.5" fill="#334155" opacity="0.4"/>
  <text x="24" y="26.5" font-size="3.5" font-family="'Inter', sans-serif" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">999.0</text>
  <text x="24" y="31" font-size="2.6" font-family="'Inter', sans-serif" font-weight="800" fill="#F8FAFC" text-anchor="middle">AG SILVER</text>
  
  <!-- Shine Effect -->
  <path d="M 12 18 L 22 18 L 18 10 Z" fill="#FFFFFF" opacity="0.6"/>
</svg>
