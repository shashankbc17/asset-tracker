<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="40" height="40">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="30%" stop-color="#FFD54F"/>
      <stop offset="70%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#FF8F00"/>
    </linearGradient>
    <linearGradient id="goldTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFF8E1"/>
      <stop offset="50%" stop-color="#FFE57F"/>
      <stop offset="100%" stop-color="#FFD54F"/>
    </linearGradient>
    <linearGradient id="goldSide" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFA000"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#FF8F00" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Outer Glow / Shadow -->
  <g filter="url(#goldGlow)">
    <!-- Base Bar (trapezoid front) -->
    <polygon points="6,34 42,34 38,40 10,40" fill="url(#goldSide)" />
    <!-- Front Face -->
    <polygon points="8,18 40,18 42,34 6,34" fill="url(#goldGrad)" />
    <!-- Top Face -->
    <polygon points="14,10 34,10 40,18 8,18" fill="url(#goldTop)" />
    <!-- Side Left Bevel -->
    <polygon points="14,10 8,18 6,34 10,40 12,34" fill="#FFC107" opacity="0.6"/>
  </g>
  
  <!-- Stamp / Engraving -->
  <rect x="18" y="22" width="12" height="6" rx="1.5" fill="#B26A00" opacity="0.35"/>
  <text x="24" y="26.5" font-size="3.5" font-family="'Inter', sans-serif" font-weight="900" fill="#FFE082" text-anchor="middle" letter-spacing="0.5">999.9</text>
  <text x="24" y="31" font-size="2.6" font-family="'Inter', sans-serif" font-weight="800" fill="#FFF8E1" text-anchor="middle">AU GOLD</text>
  
  <!-- Shine Effect -->
  <path d="M 12 18 L 22 18 L 18 10 Z" fill="#FFFFFF" opacity="0.4"/>
</svg>
