<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#020617" />
  <meta name="app-version" content="4.1.0" />
  <meta name="description" content="Personal Net Worth & Precious Metals Multi-Asset Portfolio Tracker" />

  <!-- Prevent stale caching in mobile simulators & browsers so pushes reflect immediately -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <!-- iOS & Android Native PWA Enhancements -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Wealth Tracker" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="mobile-web-app-capable" content="yes" />

  <title>Asset Tracker - Net Worth &amp; Precious Metals Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    // Ensure trailing slash on GitHub Pages so asset subpaths always resolve correctly
    if (!window.location.pathname.endsWith('/') && !window.location.pathname.includes('.')) {
      window.history.replaceState(null, '', window.location.pathname + '/' + window.location.search + window.location.hash);
    }
  </script>
</head>
<body class="bg-slate-950 text-slate-100 antialiased selection:bg-amber-500 selection:text-slate-950">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
